<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Employee Directory</h2>
      <p class="subtitle">Sign in to your account</p>
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <div *ngIf="error$ | async as error" class="alert alert-danger">
      {{ error }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="e.g. user@example.com" class="form-control">
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-danger">
          <small *ngIf="loginForm.get('email')?.hasError('required')">Email is required.</small>
          <small *ngIf="loginForm.get('email')?.hasError('email')">Invalid email format.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="Enter your password" class="form-control">
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger">
          <small *ngIf="loginForm.get('password')?.hasError('required')">Password is required.</small>
        </div>
      </div>

      <button type="submit" [disabled]="(isLoading$ | async) || loginForm.invalid" class="btn btn-primary btn-block">
        <span *ngIf="isLoading$ | async">Signing in...</span>
        <span *ngIf="!(isLoading$ | async)">Sign In</span>
      </button>
    </form>

    <div class="auth-footer">
      <span>Don't have an account?</span>
      <a routerLink="/register">Register here</a>
    </div>
  </div>
</div>
