<div class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Add New Employee</h3>
      <button type="button" class="btn-close" (click)="onCancel()">&times;</button>
    </div>

    <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="employeeCode">Employee Code *</label>
        <input id="employeeCode" type="text" formControlName="employeeCode" class="form-control" placeholder="e.g. EMP-001" />
        <div *ngIf="employeeForm.get('employeeCode')?.touched && employeeForm.get('employeeCode')?.invalid" class="text-danger">
          <small>Employee Code is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="fullName">Full Name *</label>
        <input id="fullName" type="text" formControlName="fullName" class="form-control" placeholder="e.g. Jane Doe" />
        <div *ngIf="employeeForm.get('fullName')?.touched && employeeForm.get('fullName')?.invalid" class="text-danger">
          <small>Full Name is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input id="email" type="email" formControlName="email" class="form-control" placeholder="e.g. jane@example.com" />
        <div *ngIf="employeeForm.get('email')?.touched && employeeForm.get('email')?.invalid" class="text-danger">
          <small *ngIf="employeeForm.get('email')?.hasError('required')">Email is required.</small>
          <small *ngIf="employeeForm.get('email')?.hasError('email')">Invalid email format.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="departmentId">Department *</label>
        <select id="departmentId" formControlName="departmentId" class="form-control">
          <option value="" disabled>Select Department</option>
          <option *ngFor="let dept of departments" [value]="dept.id">
            {{ dept.name }} (Capacity: {{ dept.currentHeadcount ?? 0 }}/{{ dept.maxHeadcount }})
          </option>
        </select>
        <div *ngIf="employeeForm.get('departmentId')?.touched && employeeForm.get('departmentId')?.invalid" class="text-danger">
          <small>Department is required.</small>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" (click)="onCancel()" class="btn btn-secondary">Cancel</button>
        <button type="submit" [disabled]="employeeForm.invalid" class="btn btn-primary">
          Create Employee
        </button>
      </div>
    </form>
  </div>
</div>
