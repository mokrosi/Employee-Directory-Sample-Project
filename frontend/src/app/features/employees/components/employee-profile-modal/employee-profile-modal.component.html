<div class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Employee Profile</h3>
      <button type="button" class="btn-close" (click)="onClose()">&times;</button>
    </div>

    <div class="profile-details" *ngIf="employee">
      <div class="detail-row">
        <span class="detail-label">Employee Code</span>
        <span class="detail-value">{{ employee.employeeCode }}</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Full Name</span>
        <span class="detail-value">{{ employee.fullName }}</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Email Address</span>
        <span class="detail-value">{{ employee.email }}</span>
      </div>

      <div class="detail-row">
        <span class="detail-label">Department</span>
        <span class="detail-value">{{ employee.departmentName || 'N/A' }}</span>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" (click)="onClose()" class="btn btn-secondary">Close</button>
    </div>
  </div>
</div>
